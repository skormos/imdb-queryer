volumes:
  postgres-data:
  pgadmin-data:
  sources-data:

networks:
  imdb-queryer:

services:
  # --- Always-on services: `docker compose up` / `make up` -----------------

  db:
    image: postgres:18-alpine
    # work_mem is per sort/hash step (several per query), so keep it modest.
    # maintenance_work_mem is what index and constraint builds use during a load.
    command: >
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c max_wal_size=4GB
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pgpass
    ports:
      - '${IMDB_DB_PORT:-5433}:5432'
    healthcheck:
      # Over TCP on purpose: during first-time init Postgres only listens on the
      # unix socket, so this does not pass until init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
      start_interval: 2s
    volumes:
      # Postgres 18+ keeps its data under /var/lib/postgresql/<major>/docker.
      - 'postgres-data:/var/lib/postgresql'
      - './postgres/initdb:/docker-entrypoint-initdb.d:ro'
    networks:
      - imdb-queryer

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - '${PGADMIN_PORT:-8888}:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.org
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Pre-registers the IMDB server. Only read the first time pgAdmin initialises its volume.
      - './pgadmin/servers.json:/pgadmin4/servers.json:ro'
    networks:
      - imdb-queryer
    depends_on:
      db:
        condition: service_healthy

  # --- Data pipeline: run on demand (make download / parse / load / refresh) ---

  downloader:
    profiles: [pipeline]
    build:
      dockerfile: python.Dockerfile
      context: .
      target: base
    image: imdb-python-scripts:latest
    entrypoint: ["python3", "-u", "/app/download_sources.py"]
    volumes:
      - ./scripts:/app:ro
      - 'sources-data:/src'

  parser:
    profiles: [pipeline]
    build:
      dockerfile: python.Dockerfile
      context: .
      target: base
    image: imdb-python-scripts:latest
    entrypoint: ["python3", "-u", "/app/parse_sources.py"]
    volumes:
      - ./scripts:/app:ro
      - 'sources-data:/src'
    depends_on:
      downloader:
        condition: service_completed_successfully

  loader:
    profiles: [pipeline]
    image: postgres:18-alpine
    entrypoint: ["sh", "/loader/load.sh"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: imdbowner
      PGPASSWORD: ownerpass
      PGDATABASE: imdbdb
      KEEP_PARSED: ${KEEP_PARSED:-false}
    volumes:
      - ./loader:/loader:ro
      - 'sources-data:/src'
    networks:
      - imdb-queryer
    depends_on:
      db:
        condition: service_healthy
      parser:
        condition: service_completed_successfully
